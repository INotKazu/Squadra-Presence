[package]
name = "kazucorp-smite2-companion"
version = "0.1.0"
description = "Local-first KazuCorp SMITE 2 PC and mobile companion"
authors = ["Kazuma / KazuCorp"]
repository = "https://github.com/INotKazu/Squadra-Presence"
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "kazucorp_smite2_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "1.1"
sysinfo = "0.39"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
