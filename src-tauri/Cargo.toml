[package]
name = "squadra-presence"
version = "0.6.2"
description = "Unofficial Dragon Ball Gekishin Squadra Discord Rich Presence companion"
authors = ["Kazuma / KazuCorp"]
repository = "https://github.com/INotKazu/Squadra-Presence"
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "squadra_presence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
discord-rich-presence = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2"
url = "2"
