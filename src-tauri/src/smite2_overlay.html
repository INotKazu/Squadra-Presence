<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KazuCorp SMITE 2 OBS Overlay</title>
<style>
*{box-sizing:border-box}html,body{width:720px;height:150px;margin:0;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,sans-serif;color:#f5f2e9}body{transition:opacity .2s}body.off{opacity:0}.hud{position:relative;width:704px;height:134px;margin:8px;padding:18px 24px 16px 31px;overflow:hidden;border:1px solid rgba(244,189,69,.38);border-radius:5px 18px 5px 18px;background:linear-gradient(112deg,rgba(8,10,16,.97),rgba(18,22,32,.94));filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}.hud:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 30%,rgba(244,189,69,.14),transparent 34%),repeating-linear-gradient(115deg,transparent 0 17px,rgba(255,255,255,.018) 18px 19px)}.top,.main,.stats{position:relative;z-index:1;display:flex;align-items:center}.top{gap:8px;color:#9b8350;font-size:8px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.top i{width:6px;height:6px;border-radius:50%;background:#43d9d0;box-shadow:0 0 9px #43d9d0}.top b{margin-left:auto;color:#697183}.main{gap:11px;margin:9px 0 12px}.main h1{margin:0;font-size:27px;line-height:1;text-transform:uppercase}.tag{padding:5px 8px;border:1px solid rgba(244,189,69,.25);border-radius:999px;color:#f4bd45;background:rgba(244,189,69,.07);font-size:8px;font-weight:800;text-transform:uppercase}.stats{gap:20px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}.stat{display:flex;gap:6px;align-items:baseline}.stat span{color:#697183;font-size:8px;font-weight:800;text-transform:uppercase}.stat strong{font-size:14px;font-variant-numeric:tabular-nums}.record{color:#43d9d0}.timer{margin-left:auto;color:#f4bd45}
</style></head><body class="off"><div class="hud"><div class="top"><i></i><span>KazuCorp divine link</span><b id="player">PLAYER</b></div><div class="main"><h1 id="god">SELECT A GOD</h1><span class="tag" id="role">SOLO</span><span class="tag" id="mode">CONQUEST</span></div><div class="stats"><div class="stat"><span>Session</span><strong class="record" id="record">0W–0L</strong></div><div class="stat"><span>K/D/A</span><strong id="kda">0 / 0 / 0</strong></div><div class="stat timer"><span>Live</span><strong id="timer">00:00:00</strong></div></div></div>
<script>const $=id=>document.getElementById(id);let s=null;const timer=()=>{const n=s?.sessionStartedAt?Math.max(0,Math.floor(Date.now()/1000)-s.sessionStartedAt):0;$("timer").textContent=[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,"0")).join(":")};const render=n=>{s=n;document.body.classList.toggle("off",!n.enabled);$("player").textContent=(n.playerName||"PLAYER").toUpperCase();$("god").textContent=n.godName||"SELECT A GOD";$("role").textContent=n.role||"ROLE";$("mode").textContent=n.mode||"MODE";$("record").textContent=`${n.wins||0}W–${n.losses||0}L`;$("kda").textContent=`${n.kills||0} / ${n.deaths||0} / ${n.assists||0}`;timer()};const refresh=async()=>{try{const r=await fetch(`/api/state?t=${Date.now()}`,{cache:"no-store"});if(r.ok)render(await r.json())}catch{document.body.classList.add("off")}};setInterval(timer,1000);setInterval(refresh,750);refresh();</script></body></html>
